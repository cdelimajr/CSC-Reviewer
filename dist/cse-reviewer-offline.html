<style>:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #5b6478;
  --line: #e2e6ef;
  --primary: #1e40af;
  --primary-2: #2f5bd8;
  --primary-soft: #e8eefc;
  --accent: #f5b301;
  --ok: #0f8a5f;
  --ok-soft: #e3f6ee;
  --bad: #c62f3b;
  --bad-soft: #fde8ea;
  --warn-soft: #fff6dc;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1420; --card: #171e2d; --text: #e7ebf3; --muted: #9aa4b8; --line: #283246;
    --primary: #6b8cff; --primary-2: #86a0ff; --primary-soft: #1d2843; --accent: #f5c542;
    --ok: #3cc58f; --ok-soft: #12302a; --bad: #ff6b76; --bad-soft: #3a1c22; --warn-soft: #3a3218;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--primary); }
button, input, select, textarea { font: inherit; color: inherit; }
.boot { padding: 40vh 0; text-align: center; color: var(--muted); }

/* layout */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--primary); color: #fff;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; display: flex; align-items: center; gap: 12px;
}
@media (prefers-color-scheme: dark) { .topbar { background: #18234a; } }
.brand { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; }
.brand img { width: 28px; height: 28px; border-radius: 7px; }
.topbar .spacer { flex: 1; }
.topbar .link { color: #fff; opacity: .9; text-decoration: none; font-size: 15px; padding: 6px 8px; border-radius: 8px; }
.topbar .link.active, .topbar .link:hover { background: rgba(255,255,255,.15); opacity: 1; }
.wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 96px; }
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
  display: none; padding-bottom: env(safe-area-inset-bottom);
}
.bottomnav a { flex: 1; text-align: center; padding: 8px 4px 10px; font-size: 12px; color: var(--muted); text-decoration: none; }
.bottomnav a .ic { display: block; font-size: 20px; line-height: 1.2; }
.bottomnav a.active { color: var(--primary); font-weight: 600; }
@media (max-width: 720px) {
  .topbar .nav-desktop { display: none; }
  .bottomnav { display: flex; }
}

/* elements */
h1 { font-size: 24px; margin: 8px 0 4px; line-height: 1.25; }
h2 { font-size: 19px; margin: 24px 0 10px; }
h3 { font-size: 16px; margin: 0 0 6px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; border: 1px solid var(--line); }
.grid { display: grid; gap: 12px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid.stats { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px;
  padding: 12px 18px; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; text-decoration: none;
  min-height: 46px; transition: transform .05s, background .15s;
}
.btn:hover { background: var(--primary-2); }
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--primary-soft); color: var(--primary); }
.btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--line); }
.btn.danger { background: var(--bad); }
.btn.small { padding: 6px 12px; min-height: 34px; font-size: 14px; border-radius: 9px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 6px; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=search], select, textarea {
  width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); min-height: 46px;
}
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent; }
.err { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 1em; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--primary-soft); color: var(--primary); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: #9a6b00; }
@media (prefers-color-scheme: dark) { .pill.warn { color: var(--accent); } }
.stat { padding: 14px; }
.stat .v { font-size: 26px; font-weight: 800; }
.stat .l { font-size: 13px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 8px; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit; }
.list-item .grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.bar.ok > i { background: var(--ok); }
.bar.bad > i { background: var(--bad); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
.table-wrap { overflow-x: auto; }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 8px 0 16px; padding-bottom: 2px; }
.tabs button { border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 99px; cursor: pointer; white-space: nowrap; font-weight: 600; font-size: 14px; }
.tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* hero / auth */
.hero { text-align: center; padding: 28px 8px 8px; }
.hero .logo { width: 72px; height: 72px; border-radius: 18px; box-shadow: var(--shadow); }
.hero h1 { font-size: 30px; margin-top: 14px; }
.auth { max-width: 420px; margin: 0 auto; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 18px; }
.feature { padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
.feature b { display: block; margin-bottom: 2px; }

/* exam cards */
.exam-card { display: flex; flex-direction: column; gap: 8px; }
.exam-card .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.exam-card .btn { margin-top: auto; }
.subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.subject-btn { text-align: left; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.subject-btn.active { border-color: var(--primary); outline: 2px solid var(--primary); }
.subject-btn b { display: block; }
.subject-btn span { font-size: 12px; color: var(--muted); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 64px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; }
.seg button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* exam screen */
.exam-top {
  position: sticky; top: 0; z-index: 30; background: var(--card); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
}
.exam-top .inner { max-width: 880px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; padding: 4px 10px; border-radius: 9px; background: var(--primary-soft); color: var(--primary); }
.timer.low { background: var(--bad-soft); color: var(--bad); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .6; } }
.progress { height: 4px; background: var(--line); }
.progress > i { display: block; height: 100%; background: var(--primary); transition: width .2s; }
.q-section { font-size: 13px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: .04em; }
.q-num { font-size: 14px; color: var(--muted); }
.passage { background: var(--bg); border-left: 4px solid var(--accent); padding: 12px 14px; border-radius: 8px; margin: 10px 0 14px; font-size: 15px; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
.q-text { font-size: 18px; font-weight: 600; margin: 8px 0 16px; white-space: pre-wrap; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 14px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--card); cursor: pointer; font-size: 16px; min-height: 56px;
}
.choice .letter { flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--bg); font-size: 14px; }
.choice:hover { border-color: var(--primary-2); }
.choice.selected { border-color: var(--primary); background: var(--primary-soft); }
.choice.selected .letter { background: var(--primary); color: #fff; }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.correct .letter { background: var(--ok); color: #fff; }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .letter { background: var(--bad); color: #fff; }
.choice:disabled { cursor: default; }
.explain { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); font-size: 15px; }
.exam-actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); }
.exam-actions .inner { max-width: 880px; margin: 0 auto; display: flex; gap: 10px; }
.exam-actions .btn { flex: 1; white-space: nowrap; padding-left: 10px; padding-right: 10px; }
.exam-actions .flag-btn { flex: 0 0 56px; }
.flag-btn.on { background: var(--warn-soft); color: #9a6b00; }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.navgrid button { height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 13px; font-weight: 600; position: relative; }
.navgrid button.ans { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.navgrid button.cur { outline: 2px solid var(--primary); }
.navgrid button.flag::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.navgrid button.ok { background: var(--ok-soft); color: var(--ok); }
.navgrid button.no { background: var(--bad-soft); color: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 8px 0 12px; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 15, 30, .5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--card); width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom) + 18px); }
@media (min-width: 721px) { .modal-bg { align-items: center; } .modal { border-radius: 18px; } }

/* results */
.score-ring { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; margin: 8px auto; }
.score-ring .in { width: 120px; height: 120px; border-radius: 50%; background: var(--card); display: grid; place-items: center; text-align: center; }
.score-ring .pct { font-size: 30px; font-weight: 800; line-height: 1; }
.review-item { padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
.review-item .ans-line { font-size: 15px; margin-top: 4px; }

#toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #172033; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.notice { padding: 12px 14px; border-radius: 10px; background: var(--primary-soft); font-size: 14px; }
.hide-mobile { }
@media (max-width: 720px) { .hide-mobile { display: none; } }

.offline-bar { background: #f5b301; color: #172033; font-size: 13px; text-align: center; padding: 6px 12px; }
.offline-bar button { background: none; border: 0; text-decoration: underline; cursor: pointer; font-size: 13px; color: inherit; padding: 0 4px; }
</style>
</head>

<script>window.__CSE_BANK = {"version":"d20dcf0662a4","sources":["https://raw.githubusercontent.com/cdelimajr/CSC-Reviewer/main/questions/questions.json"],"questions":[{"s":"general","t":"1987 Constitution","l":"both","q":"The 1987 Philippine Constitution was ratified in a plebiscite held on:","a":"February 2, 1987","d":["February 25, 1986","October 15, 1986","June 12, 1987"],"e":"The Constitution was ratified by the people in the plebiscite of February 2, 1987.","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"Under the 1987 Constitution, sovereignty resides in:","a":"the people","d":["the President","Congress","the Supreme Court"],"e":"Article II, Section 1: \"Sovereignty resides in the people and all government authority emanates from them.\"","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"Article II, Section 1 of the 1987 Constitution declares that the Philippines is a:","a":"democratic and republican State","d":["federal and parliamentary State","socialist and democratic State","unitary and monarchical State"],"e":"Article II, Section 1: \"The Philippines is a democratic and republican State.\"","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"Which article of the 1987 Constitution contains the Bill of Rights?","a":"Article III","d":["Article II","Article VI","Article XIII"],"e":"Article III is the Bill of Rights.","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"Which article of the 1987 Constitution deals with the Accountability of Public Officers?","a":"Article XI","d":["Article IX","Article VII","Article XVI"],"e":"Article XI covers Accountability of Public Officers, including impeachment and the Ombudsman.","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"\"Public office is a public trust.\" This principle is found in which provision?","a":"Article XI, Section 1","d":["Article II, Section 1","Article III, Section 1","Article IX-B, Section 2"],"e":"Article XI, Section 1 begins: \"Public office is a public trust.\"","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"The President of the Philippines is elected for a term of:","a":"six years, without reelection","d":["four years, with one reelection","six years, with one reelection","five years, without reelection"],"e":"Article VII, Section 4: the President shall not be eligible for any reelection.","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"What is the minimum age requirement for the President of the Philippines on the day of the election?","a":"40 years old","d":["35 years old","45 years old","30 years old"],"e":"Article VII, Section 2: at least forty years of age on the day of the election.","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"How many senators compose the Senate of the Philippines?","a":"24","d":["12","20","30"],"e":"Article VI, Section 2: twenty-four Senators elected at large.","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"A senator must be at least how old on the day of the election?","a":"35 years old","d":["25 years old","30 years old","40 years old"],"e":"Article VI, Section 3: at least thirty-five years of age.","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"The term of office of a member of the House of Representatives is:","a":"three years, with a maximum of three consecutive terms","d":["six years, with a maximum of two consecutive terms","three years, with a maximum of two consecutive terms","four years, with no term limit"],"e":"Article VI, Section 7.","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"A senator may serve for no more than how many consecutive terms?","a":"Two","d":["One","Three","Four"],"e":"Article VI, Section 4: no Senator shall serve for more than two consecutive terms. Each term is six years.","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"Party-list representatives shall constitute what percentage of the total number of representatives in the Ho ""},{"s":"general","t":"1987 Constitution","l":"both","q":"The Chairman and Commissioners of the Civil Service Commission serve a term of:","a":"seven years without reappointment","d":["six years with one reappointment","five years without reappointment","four years with reappointment"],"e":"Article IX-B, Section 1(2).","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"The Civil Service Commission is composed of:","a":"a Chairman and two Commissioners","d":["a Chairman and four Commissioners","a Chairman and six Commissioners","three Commissioners only"],"e":"Article IX-B, Section 1(1).","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"According to the Constitution, appointments in the civil service shall be made according to:","a":"merit and fitness","d":["seniority and loyalty","political affiliation","educational attainment only"],"e":"Article IX-B, Section 2(2): merit and fitness, determined as far as practicable by competitive examination.","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"Which positions are exempted from the competitive examination requirement in the civil service?","a":"Policy-determining, primarily confidential, and highly technical positions","d":["All first-level positions","All positions in local government units","Casual and contractual positions only"],"e":"Article IX-B, Section 2(2).","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"The civil service embraces all branches, subdivisions, instrumentalities and agencies of the Government, including government-owned or controlled corporations:","a":"with original charters","d":["organized under the Corporation Code","with foreign partners","listed in the stock market"],"e":"Article IX-B, Section 2(1).","p":""},{"s":"general","t":"1987 Constitution","l":"both","q":"Civilian authority is, at all times, supreme over the:","a":"military","d":["Church","judiciary","legislature"],"e":"Article II, Section 3.","p":""},{"s":"general","t":"1987 ":"both","q":"The international agreement that aims to protect the ozone layer by phasing out ozone-depleting substances is the:","a":"Montreal Protocol","d":["Kyoto Protocol","Paris Agreement","Geneva Convention"],"e":"The Montreal Protocol was adopted in 1987.","p":""},{"s":"general","t":"Environment","l":"both","q":"The 2015 international climate agreement that aims to limit global warming to well below 2°C is the:","a":"Paris Agreement","d":["Kyoto Protocol","Montreal Protocol","Rio Declaration"],"e":"The Paris Agreement was adopted in December 2015.","p":""},{"s":"general","t":"Environment","l":"both","q":"Which gas is the main contributor to the greenhouse effect from human activities?","a":"Carbon dioxide","d":["Oxygen","Nitrogen","Helium"],"e":"Burning fossil fuels releases carbon dioxide, the main human-made greenhouse gas.","p":""},{"s":"general","t":"Environment","l":"both","q":"Which of the following is biodegradable waste?","a":"Vegetable peelings","d":["Plastic bottles","Glass jars","Aluminum cans"],"e":"Biodegradable waste can be broken down naturally by microorganisms.","p":""},{"s":"general","t":"Environment","l":"both","q":"Under RA 9003, the facility where segregated recyclable and compostable wastes are sorted in a barangay is called a:","a":"Materials Recovery Facility (MRF)","d":["Sanitary landfill","Open dumpsite","Incinerator"],"e":"RA 9003 requires an MRF in every barangay or cluster of barangays.","p":""},{"s":"general","t":"Environment","l":"both","q":"The 3Rs of waste management are:","a":"Reduce, Reuse, Recycle","d":["Remove, Replace, Repair","Reduce, Refuse, Remove","Recycle, Rebuild, Restore"],"e":"Reduce, Reuse, Recycle.","p":""},{"s":"general","t":"Human Rights","l":"both","q":"The Universal Declaration of Human Rights was adopted by the United Nations General Assembly on:","a":"December 10, 1948","d":["October 24, 1945","June 26, 1945","December 10, 1966"],"e":"December 10 is celebrated as Human Rights Day.","p":""},{"s":"general","t":"Human Rights","l":"both","q":"Human rights are said to be inalienable. This means they:","a":"cannot be taken away or surrendered","d":["apply only to citizens","are granted by the government","can be sold or transferred"],"e":"Inalienable rights cannot be given up or taken away, except in specific situations under due process.","p":""},{"s":"general","t":"Human Rights","l":"both","q":"The writ that protects a person whose right to life, liberty and security is violated or threatened is the writ of:","a":"amparo","d":["habeas data","certiorari","mandamus"],"e":"The writ of amparo was introduced by the Supreme Court in 2007.","p":""},{"s":"general","t":"Human Rights","l":"both","q":"The writ that protects a person's right to privacy in information about themselves is the writ of:","a":"habeas data","d":["habeas corpus","amparo","prohibition"],"e":"Habeas data concerns information privacy.","p":""},{"s":"general","t":"Human Rights","l":"both","q":"The writ that directs a person detaining another to produce the body of the detainee in court is the writ of:","a":"habeas corpus","d":["habeas data","amparo","kalikasan"],"e":"Habeas corpus means \"you shall have the body.\"","p":""},{"s":"general","t":"Human Rights","l":"both","q":"The writ that protects the constitutional right to a balanced and healthful ecology is the writ of:","a":"kalikasan","d":["amparo","habeas data","mandamus"],"e":"The writ of kalikasan was introduced in the 2010 Rules of Procedure for Environmental Cases.","p":""},{"s":"general","t":"Peace and Security","l":"both","q":"The government office that leads the peace process in the Philippines is the:","a":"Office of the Presidential Adviser on Peace, Reconciliation and Unity (OPAPRU)","d":["Department of National Defense","Commission on Human Rights","National Security Council"],"e":"OPAPRU (formerly OPAPP) manages the comprehensive peace process.","p":""},{"s":"general","t":"Peace and Security","l":"both","q":"A \"culture of peace\" is best promo ,"August 1983","January 2001"],"e":"The EDSA Revolution happened on February 22–25, 1986.","p":""},{"s":"general","t":"Philippine Geography","l":"both","q":"The highest mountain in the Philippines is:","a":"Mount Apo","d":["Mount Pulag","Mount Mayon","Mount Dulang-dulang"],"e":"Mount Apo in Mindanao is about 2,954 meters high.","p":""},{"s":"general","t":"Philippine Geography","l":"both","q":"The longest river in the Philippines is the:","a":"Cagayan River","d":["Pasig River","Rio Grande de Mindanao","Agno River"],"e":"The Cagayan River in northern Luzon is the longest.","p":""},{"s":"general","t":"Philippine Geography","l":"both","q":"The largest island in the Philippines is:","a":"Luzon","d":["Mindanao","Samar","Palawan"],"e":"Luzon is the largest island, followed by Mindanao.","p":""},{"s":"general","t":"Philippine Geography","l":"both","q":"The largest lake in the Philippines is:","a":"Laguna de Bay","d":["Lake Lanao","Taal Lake","Lake Buhi"],"e":"Laguna de Bay is the largest lake in the country.","p":""},{"s":"general","t":"Philippine Government","l":"both","q":"The government agency that serves as the central personnel agency of the Philippine government is the:","a":"Civil Service Commission","d":["Department of Labor and Employment","Commission on Audit","Department of Budget and Management"],"e":"Article IX-B and the Administrative Code of 1987 make the CSC the central personnel agency.","p":""},{"s":"general","t":"Philippine Government","l":"both","q":"The Career Service Professional eligibility is generally required for:","a":"second-level positions","d":["first-level positions only","elective positions","third-level positions only"],"e":"Professional eligibility is for second-level positions; Subprofessional for first-level positions.","p":""},{"s":"general","t":"Philippine Government","l":"both","q":"The passing rate for the Career Service Examination is:","a":"80%","d":["75%","70%","85%"],"e":"An examinee must get a general rating of at least 80.00%.", al reefs in the world. These reefs serve as breeding grounds for fish, protect coastlines from strong waves, and attract tourists who bring income to coastal communities. However, illegal fishing methods such as dynamite and cyanide fishing, as well as pollution and rising sea temperatures, have damaged a large portion of these reefs. Marine scientists warn that unless communities, government and businesses work together to protect them, many reefs may not recover within our lifetime."},{"s":"verbal","t":"Reading Comprehension","l":"both","q":"Which of the following is NOT mentioned as a benefit of coral reefs?","a":"They provide fresh drinking water.","d":["They serve as breeding grounds for fish.","They protect coastlines from strong waves.","They attract tourists."],"e":"Drinking water is not mentioned in the passage.","p":"The Philippine archipelago is home to some of the richest coral reefs in the world. These reefs serve as breeding grounds for fish, protect coastlines from strong waves, and attract tourists who bring income to coastal communities. However, illegal fishing methods such as dynamite and cyanide fishing, as well as pollution and rising sea temperatures, have damaged a large portion of these reefs. Marine scientists warn that unless communities, government and businesses work together to protect them, many reefs may not recover within our lifetime."},{"s":"verbal","t":"Reading Comprehension","l":"both","q":"Based on the passage, marine scientists are:","a":"concerned about the future of the reefs","d":["confident that reefs will recover soon","indifferent to the condition of the reefs","opposed to tourism in coastal areas"],"e":"They \"warn\" that many reefs may not recover within our lifetime.","p":"The Philippine archipelago is home to some of the richest coral reefs in the world. These reefs serve as breeding grounds for fish, protect coastlines from strong waves, and attract tourists who bring income to coastal communities. However, illegal fishing methods such as dynamite and cyanide fishing, as well as pollution and rising sea temperatures, have damaged a large portion of these reefs. Marine scientists warn that unless communities, government and businesses work together to protect them, many reefs may not recover within our lifetime."},{"s":"verbal","t":"Reading Comprehension","l":"both","q":"According to the passage, why are government employees accountable to the people?","a":"Because their salaries are paid with public funds.","d":["Because they are elected by the people.","Because they work long hours.","Because they are required to pass an exam."],"e":"\"Because public funds pay their salaries, they are accountable to the people at all times.\"","p":"Public service is often described as a calling rather than a mere job. A government employee is expected to serve the public with integrity, courtesy and efficiency. Because public funds pay their salaries, they are accountable to the people at all times. Small acts, such as answering inquiries promptly or explaining requirements clearly, build public trust. On the other hand, delays, rudeness and favoritism erode that trust and make citizens doubt the government's ability to deliver services."},{"s":"verbal","t":"Reading Comprehension","l":"both","q":"The word \"erode\" in the passage most nearly means:","a":"gradually weaken","d":["quickly build","clearly explain","completely restore"],"e":"Delays and rudeness slowly wear away public trust.","p":"Public service is often described as a calling rather than a mere job. A government employee is expected to serve the public with integrity, courtesy and efficiency. Because public funds pay their salaries, they are accountable to the people at all times. Small acts, such as answering inquiries promptly or explaining requirements clearly, build public trust. On the other hand, delays, rudeness and favoritism erode that trust and make citizens doubt the government's ability to deliver services."},{"s":"verbal","t":"Reading Comprehension","l":"both","q":"Which statement would the author most likely agree with?","a":"Even small acts of good service help build public trust.","d":["Only big projects affect public trust.","Courtesy is less important than speed.","Public service is just like any private job."],"e":"The author says \"small acts... build public trust.\"","p":"Public service is often described as a calling rather than a mere job. A government employee is expected to serve the public with integrity, courtesy and efficiency. Because public funds pay their salaries, they are accountable to the people at all times. Small acts, such as answering inquiries promptly or explaining requirements clearly, build public trust. On the other hand, delays, rudeness and favoritism erode that trust and make citizens doubt the government's ability to deliver services."},{"s":"verbal","t":"Pag-unawa sa Binasa","l":"both","q":"Ano ang pangunahing kaisipan ng talata?","a":"Maraming kabutihang naidudulot ang pagbabasa kaya dapat itong gawing ugali.","d":["Mas mabuti ang paglalakbay kaysa pagbabasa.","Walang saysay ang lahat ng uri ng libangan.","Ang mga aklat ay para lamang sa mga mag-aaral."],"e":"Inilalahad ng talata ang mga benepisyo ng pagbabasa at hinihikayat ang mga kabataan na magbasa araw-araw.","p":"Ang pagbabasa ay isa sa pinakamabisang paraan upang mapalawak ang kaalaman. Sa bawat aklat na binubuklat, nakapaglalakbay tayo sa iba't ibang lugar at panahon nang hindi umaalis sa ating kinauupuan. Bukod dito, napauunlad ng pagbabasa ang ating talasalitaan at kakayahang mag-isip nang kritikal. Kaya naman, hinihikayat ang mga kabataan na gawing bahagi ng kanilang araw-araw na gawain ang pagbabasa, sa halip na ubusin ang oras sa walang saysay na libangan."},{"s":"verbal","t":"Pag-unawa sa Binasa","l":"both","q":"Ayon sa talata, paano tayo \"nakapaglalakbay\" sa pamamagitan ng pagbabasa?","a":"Sa pamamagitan ng imahinasyon habang binabasa ang aklat","d":["Sa pagsakay sa eroplano","Sa panonood ng pelikula","Sa pagbisita sa aklatan sa ibang bansa"],"e":"Nakapaglalakbay tayo \"nang hindi umaalis sa ating kinauupuan.\"","p":"Ang pagbabasa ay isa sa pinakamabisang paraan upang mapalawak ang kaalaman. Sa bawat aklat na binubuklat, nakapaglalakbay tayo sa iba't ibang lugar at panahon nang hindi umaalis sa ating kinauupuan. Bukod dito, napauunlad ng pagbabasa ang ating talasalitaan at kakayahang mag-isip nang kritikal. Kaya naman, hinihikayat ang mga kabataan na gawing bahagi ng kanilang araw-araw na gawain ang pagbabasa, sa halip na ubusin ang oras sa walang saysay na libangan."},{"s":"verbal","t":"Pag-unawa sa Binasa","l":"both","q":"Ang salitang \"talasalitaan\" sa talata ay tumutukoy sa:","a":"bokabularyo o mga salitang alam ng isang tao","d":["talambuhay ng manunulat","tamang pagbigkas","balarila ng wika"],"e":"Ang talasalitaan ay ang bokabularyo.","p":"Ang pagbabasa ay isa sa pinakamabisang paraan upang mapalawak ang kaalaman. Sa bawat aklat na binubuklat, nakapaglalakbay tayo sa iba't ibang lugar at panahon nang hindi umaalis sa ating kinauupuan. Bukod dito, napauunlad ng pagbabasa ang ating talasalitaan at kakayahang mag-isip nang kritikal. Kaya naman, hinihikayat ang mga kabataan na gawing bahagi ng kanilang araw-araw na gawain ang pagbabasa, sa halip na ubusin ang oras sa walang saysay na libangan."},{"s":"verbal","t":"Reading Comprehension","l":"both","q":"According to the passage, why do many organizations adopt a hybrid arrangement?","a":"To balance the benefits of remote work with the need for teamwork and connection","d":["To reduce employee salaries","Because remote work is less productive","Because the law requires it"],"e":"Hybrid work addresses isolation and teamwork issues while keeping the benefits of remote work.","p":"Remote work became widespread during the pandemic. Many employees discovered that they could be just as productive at home, saving hours that used to be spent in traffic. Employers, meanwhile, found that they could reduce office costs. Still, remote work has drawbacks. Some workers feel isolated, and teams may find it harder to build trust and share ideas informally. For this reason, many organizations now adopt a hybrid arrangement, in which employees work from home on some days and in the office on others."},{"s":"verbal","t":"Reading Comprehension","l":"both","q":"Which is mentioned as a drawback of remote work?","a":"Some workers feel isolated.","d":["Employees spend more time in traffic.","Office costs increase.","Employees become less productive."],"e":"The passage says \"Some workers feel isolated.\"","p":"Remote work became widespread during the pandemic. Many employees discovered that they could be just as productive at home, saving hours that used to be spent in traffic. Employers, meanwhile, found that they could reduce office costs. Still, remote work has drawbacks. Some workers feel isolated, and teams may find it harder to build trust and share ideas informally. For this reason, many organizations now adopt a hybrid arrangement, in which employees work from home on some days and in the office on others."},{"s":"verbal","t":"Reading Comprehension","l":"both","q":"What is the main point of the passage?","a":"The impact of typhoons can be reduced through preparedness and planning.","d":["Typhoons can be prevented with technology.","Typhoons rarely affect the Philippines.","Evacuation centers are no longer needed."],"e":"The passage stresses reducing impact through warning systems, planning and preparedness.","p":"Typhoons are a regular part of life in the Philippines, with around twenty entering the country's area of responsibility each year. While these storms cannot be prevented, their impact can be reduced. Early warning systems, well-planned evacuation centers and stricter building codes have saved many lives. Experts also stress the importance of community preparedness: families who know their evacuation routes and keep emergency kits ready are far more likely to stay safe."},{"s":"verbal","t":"Reading Comprehension","l":"both","q":"About how many typhoons enter the Philippine area of responsibility each year, according to the passage?","a":"Around twenty","d":["Around five","Around fifty","Around one hundred"],"e":"\"around twenty entering the country's area of responsibility each year.\"","p":"Typhoons are a regular part of life in the Philippines, with around twenty entering the country's area of responsibility each year. While these storms cannot be prevented, their impact can be reduced. Early warning systems, well-planned evacuation centers and stricter building codes have saved many lives. Experts also stress the importance of community preparedness: families who know their evacuation routes and keep emergency kits ready are far more likely to stay safe."},{"s":"verbal","t":"Grammar","l":"both","q":"Choose the correct sentence.","a":"Neither the manager nor the employees were informed.","d":["Neither the manager nor the employees was informed.","Neither the manager or the employees were informed.","Neither the manager nor the employees has been informed."],"e":"With \"neither...nor,\" the verb agrees with the nearer subject (\"employees\" → were).","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Each of the applicants ___ required to submit a résumé.","a":"is","d":["are","were","have been"],"e":"\"Each\" is singular, so it takes \"is.\"","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"The committee ___ already submitted its report.","a":"has","d":["have","are","were"],"e":"A collective noun acting as one unit (\"its report\") takes a singular verb.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"She is one of the employees who ___ always on time.","a":"are","d":["is","was","has been"],"e":"\"Who\" refers to \"employees\" (plural), so the verb is \"are.\"","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"If I ___ the director, I would approve the proposal.","a":"were","d":["was","am","will be"],"e":"Use the subjunctive \"were\" for hypothetical situations.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"The documents were given to Maria and ___.","a":"me","d":["I","myself","mine"],"e":"Use the object pronoun \"me\" after the preposition \"to.\"","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"By the time the guests arrived, we ___ dinner.","a":"had already prepared","d":["already prepare","have already prepared","are already preparing"],"e":"Use the past perfect for an action completed before another past action.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"She has been working in this office ___ 2019.","a":"since","d":["for","from","during"],"e":"Use \"since\" with a specific point in time.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"He has been working here ___ five years.","a":"for","d":["since","at","within"],"e":"Use \"for\" with a period of time.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"There are ___ applicants this year than last year.","a":"fewer","d":["less","lesser","few"],"e":"Use \"fewer\" with countable nouns.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Please submit the report ___ Friday.","a":"by","d":["until","at","in"],"e":"\"By Friday\" means no later than Friday.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"The new policy will ___ all employees.","a":"affect","d":["effect","affection","effective"],"e":"\"Affect\" is usually a verb (to influence); \"effect\" is usually a noun (result).","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Choose the correctly punctuated sentence.","a":"The employees' lounge is on the second floor.","d":["The employee's lounge are on the second floor.","The employees lounge' is on the second floor.","The employees's lounge is on the second floor."],"e":"For plural nouns ending in -s, add only an apostrophe: employees'.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Which sentence is correct?","a":"It's important to know its purpose.","d":["Its important to know it's purpose.","It's important to know it's purpose.","Its important to know its purpose."],"e":"\"It's\" = it is; \"its\" = possessive.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Choose the correct sentence.","a":"They submitted their forms over there.","d":["They're submitted there forms over their.","There submitted their forms over they're.","They submitted there forms over their."],"e":"\"They\" = subject, \"their\" = possessive, \"there\" = place.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"The number of applicants ___ increasing every year.","a":"is","d":["are","were","have been"],"e":"\"The number of\" takes a singular verb; \"a number of\" takes a plural verb.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"A number of employees ___ attending the seminar.","a":"are","d":["is","was","has been"],"e":"\"A number of\" means \"many,\" so it takes a plural verb.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Mathematics ___ my favorite subject in school.","a":"was","d":["were","are","have been"],"e":"Subjects like mathematics, physics and economics are singular.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Between you and ___, the plan will not work.","a":"me","d":["I","myself","mine"],"e":"After a preposition (\"between\"), use the object pronoun \"me.\"","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Of the two proposals, this one is ___.","a":"better","d":["best","more better","the best"],"e":"Use the comparative form when comparing two things.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"She sings ___ than her sister.","a":"more beautifully","d":["more beautiful","most beautifully","beautifuller"],"e":"Use the adverb \"beautifully\" to describe how she sings, in comparative form.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"The supervisor, along with his staff, ___ attending the meeting.","a":"is","d":["are","were","have been"],"e":"Phrases like \"along with\" do not change the subject; \"supervisor\" is singular.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"I would have passed the exam if I ___ harder.","a":"had studied","d":["studied","have studied","would study"],"e":"Third conditional: if + past perfect, would have + past participle.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Choose the sentence with correct parallel structure.","a":"She likes reading, writing, and painting.","d":["She likes reading, writing, and to paint.","She likes to read, writing, and painting.","She likes reading, to write, and paint."],"e":"Items in a series should have the same grammatical form.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Neither of the reports ___ complete.","a":"is","d":["are","were","have been"],"e":"\"Neither\" as a pronoun is singular.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"The memo was written by the director ___ was approved by the board.","a":"and","d":["but","or","so"],"e":"\"And\" joins two related actions.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"He didn't say ___ to anyone about the incident.","a":"anything","d":["nothing","something","none"],"e":"Avoid double negatives: \"didn't say anything.\"","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"The clerk ___ the files yesterday.","a":"arranged","d":["arranges","has arranged","will arrange"],"e":"\"Yesterday\" signals the simple past tense.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"The applicant asked me where ___.","a":"the office was","d":["was the office","is the office","the office is it"],"e":"In indirect questions, use statement word order.","p":""},{"s":"verbal","t":"Grammar","l":"both","q":"Everybody ___ to bring a valid ID.","a":"needs","d":["need","are needing","have needed"],"e":"\"Everybody\" is singular.","p":""},{"s":"verbal","t":"Error Identification","l":"both","q":"Identify the error: \"Each (A) of the (B) students (C) have submitted (D) their projects.\"","a":"(C) have submitted","d":["(A) Each","(B) students","(D) their projects"],"e":"\"Each\" is singular → \"has submitted.\"","p":""},{"s":"verbal","t":"Error Identification","l":"both","q":"Identify the error: \"She (A) don't (B) like (C) waiting in (D) long lines.\"","a":"(A) don't","d":["(B) like","(C) waiting","(D) long lines"],"e":"With \"she,\" use \"doesn't.\"","p":""},{"s":"verbal","t":"Error Identification","l":"both","q":"Identify the error: \"The (A) informations you (B) gave (C) were very (D) helpful.\"","a":"(A) informations","d":["(B) gave","(C) were","(D) helpful"],"e":"\"Information\" is uncountable; it should be \"The information... was very helpful.\"","p":""},{"s":"verbal","t":"Error Identification","l":"both","q":"Identify the error: \"He (A) is (B) more taller (C) than (D) his brother.\"","a":"(B) more taller","d":["(A) is","(C) than","(D) his brother"],"e":"Use \"taller,\" not \"more taller.\"","p":""},{"s":"verbal","t":"Error Identification","l":"both","q":"Identify the error: \"(A) Me and Ana (B) went to the (C) office (D) early.\"","a":"(A) Me and Ana","d":["(B) went","(C) office","(D) early"],"e":"Use the subject pronoun: \"Ana and I went...\"","p":""},{"s":"verbal","t":"Error Identification","l":"both","q":"Identify the error: \"The (A) team (B) are (C) planning (D) its next project.\"","a":"(B) are","d":["(A) team","(C) planning","(D) its"],"e":"Since \"its\" treats the team as one unit, the verb should be \"is.\"","p":""},{"s":"verbal","t":"Sentence Completion","l":"both","q":"The manager praised her for being ___; she always finished tasks ahead of schedule.","a":"punctual","d":["negligent","indifferent","lethargic"],"e":"Finishing tasks ahead of schedule shows punctuality.","p":""},{"s":"verbal","t":"Sentence Completion","l":"both","q":"Because the instructions were so ___, nobody knew what to do.","a":"vague","d":["explicit","concise","precise"],"e":"Unclear (vague) instructions cause confusion.","p":""},{"s":"verbal","t":"Sentence Completion","l":"both","q":"The official was ___ for his honesty; he never accepted bribes.","a":"renowned","d":["notorious","condemned","ridiculed"],"e":"\"Renowned\" means famous for something good.","p":""},{"s":"verbal","t":"Sentence Completion","l":"both","q":"The town was ___ after the typhoon; houses and roads were destroyed.","a":"devastated","d":["rejuvenated","beautified","fortified"],"e":"Destroyed houses and roads mean the town was devastated.","p":""},{"s":"verbal","t":"Sentence Completion","l":"both","q":"Her ___ attitude made her popular among her co-workers.","a":"amiable","d":["hostile","arrogant","aloof"],"e":"An amiable (friendly) attitude makes one popular.","p":""},{"s":"verbal","t":"Sentence Completion","l":"both","q":"The data are ___; we cannot draw a conclusion until more information is collected.","a":"inconclusive","d":["definitive","overwhelming","decisive"],"e":"Inconclusive data do not lead to a firm conclusion.","p":""},{"s":"verbal","t":"Sentence Completion","l":"both","q":"Despite his ___ background, he became one of the richest businessmen in the country.","a":"humble","d":["affluent","privileged","luxurious"],"e":"\"Despite\" signals contrast with becoming rich.","p":""},{"s":"verbal","t":"Idioms","l":"both","q":"What does \"to burn the midnight oil\" mean?","a":"to work or study late into the night","d":["to waste resources","to start a fire","to sleep early"],"e":"This idiom means to stay up late working or studying.","p":""},{"s":"verbal","t":"Idioms","l":"both","q":"What does \"to break the ice\" mean?","a":"to ease tension and start a conversation","d":["to destroy something","to stop a fight","to cancel an agreement"],"e":"Breaking the ice makes people feel more comfortable.","p":""},{"s":"verbal","t":"Idioms","l":"both","q":"What does \"a piece of cake\" mean?","a":"something very easy","d":["a small reward","a birthday treat","a difficult problem"],"e":"\"A piece of cake\" means very easy.","p":""},{"s":"verbal","t":"Idioms","l":"both","q":"What does \"to hit the nail on the head     return mk(N, 'Ratio and Proportion', `${peso(total)} is to be divided between two siblings in the ratio ${a}:${b}. How much is the larger share?`,
      peso(b * unit), [peso(a * unit), peso(total / 2), peso((b + 1) * unit), peso((b - 1) * unit || unit * 3)],
      `Total parts = ${a + b}. One part = ${peso(total)} ÷ ${a + b} = ${peso(unit)}. Larger share = ${b} × ${peso(unit)} = ${peso(b * unit)}.`);
  },
  function proportion() {
    const n1 = ri(2, 6), price = ri(3, 15) * n1, n2 = ri(7, 20);
    const unit = price / n1;
    const ans = unit * n2;
    const item = pick(['notebooks', 'ballpens', 'pencils', 'folders', 'envelopes']);
    return mk(N, 'Ratio and Proportion', `If ${n1} ${item} cost ${peso(price)}, how much will ${n2} ${item} cost?`,
      peso(ans), numDistractors(ans, { step: unit }).map(peso),
      `Price of one = ${peso(price)} ÷ ${n1} = ${peso(unit)}. ${n2} × ${peso(unit)} = ${peso(ans)}.`);
  },
  function linear() {
    const a = ri(2, 9), x = ri(-10, 15), b = ri(-20, 20);
    const c = a * x + b;
    const bs = b >= 0 ? `+ ${b}` : `− ${-b}`;
    return mk(N, 'Algebra', `Solve for x: ${a}x ${bs} = ${c}`,
      x, numDistractors(x, { step: 1, allowNeg: true }).concat([-x, x + 2]),
      `${a}x = ${c} ${b >= 0 ? '−' : '+'} ${Math.abs(b)} = ${c - b}. x = ${c - b} ÷ ${a} = ${x}.`);
  },
  function fractions() {
    const b = pick([2, 3, 4, 5, 6, 8]), d = pick([3, 4, 5, 6, 8, 10, 12]);
    const a = ri(1, b - 1), c = ri(1, d - 1);
    const op = pick(['+', '−']);
    let num = op === '+' ? a * d + c * b : a * d - c * b;
    let den = b * d;
    if (num <= 0) return null;
    const g = gcd(num, den); num /= g; den /= g;
    const f = (n, dd) => (dd === 1 ? `${n}` : `${n}/${dd}`);
    const wrong1 = op === '+' ? f(a + c, b + d) : f(Math.abs(a - c) || 1, Math.abs(b - d) || 2);
    return mk(N, 'Fractions', `Simplify: ${a}/${b} ${op} ${c}/${d}`,
      f(num, den), [wrong1, f(num + 1, den), f(num, den + 1), f(Math.max(1, num - 1), den)],
      `LCD = ${b * d}. (${a * d} ${op === '+' ? '+' : '−'} ${c * b})/${b * d} = ${f(num, den)} in lowest terms.`);
  },
  function orderOps() {
    const b = ri(2, 9), c = ri(2, 9), e = ri(2, 6), d = e * ri(2, 9), a = ri(5, 40);
    const ans = a + b * c - d / e;
    return mk(N, 'Basic Operations', `Evaluate: ${a} + ${b} × ${c} − ${d} ÷ ${e}`,
      ans, [((a + b) * c - d) / e, (a + b) * c - d / e, a + b * (c - d / e), ans + e],
      `Multiply/divide first: ${b} × ${c} = ${b * c}, ${d} ÷ ${e} = ${d / e}. Then ${a} + ${b * c} − ${d / e} = ${ans}.`);
  },
  function profit() {
    const cost = ri(4, 40) * 50;
    const p = pick([10, 20, 25, 30, 40, 50]);
    const sell = cost + (cost * p) / 100;
    return mk(N, 'Percentage', `A store owner bought an item for ${peso(cost)} and sold it for ${peso(sell)}. What is the percent profit based on cost?`,
      p + '%', numDistractors(p, { step: 5 }).map((x) => x + '%'),
      `Profit = ${peso(sell - cost)}. ${peso(sell - cost)} ÷ ${peso(cost)} × 100 = ${p}%.`);
  },
  function decimals() {
    const a = ri(11, 99) / 10, b = ri(11, 49) / 10;
    const ans = Number((a * b).toFixed(2));
    return mk(N, 'Decimals', `What is ${a} × ${b}?`,
      fmt(ans), [fmt(Number((a * b * 10).toFixed(1))), fmt(Number((a + b).toFixed(2))), fmt(Number((ans + 0.1).toFixed(2))), fmt(Number((ans / 10).toFixed(3)))],
      `${a} × ${b} = ${fmt(ans)}.`);
  },
  function numberSeriesN() { return series(N); },
  function wordProblemCoins() {
    const total = ri(10, 30);
    const fives = ri(2, total - 2);
    const tens = total - fives;
    const amount = fives * 5 + tens * 10;
    return mk(N, 'Word Problem', `Juan has ${total} coins consisting of ₱5 and ₱10 coins. Their total value is ${peso(amount)}. How many ₱10 coins does he have?`,
      tens, [fives, tens + 1, tens - 1, Math.round(total / 2) === tens ? tens + 2 : Math.round(total / 2)],
      `Let t = ₱10 coins. 10t + 5(${total} − t) = ${amount} → 5t = ${amount - 5 * total} → t = ${tens}.`);
  },
  function areaPerimeter() {
    const l = ri(5, 30), w = ri(3, l);
    if (Math.random() < 0.5) {
      return mk(N, 'Geometry', `A rectangular lot is ${l} m long and ${w} m wide. What is its area?`,
        `${l * w} sq m`, [`${2 * (l + w)} sq m`, `${l * w + l} sq m`, `${l * w - w} sq m`, `${(l + w) * 2 + 10} sq m`],
        `Area = length × width = ${l} × ${w} = ${l * w} sq m.`);
    }
    return mk(N, 'Geometry', `How many meters of fencing are needed to enclose a rectangular garden ${l} m long and ${w} m wide?`,
      `${2 * (l + w)} m`, [`${l * w} m`, `${l + w} m`, `${2 * (l + w) + 4} m`, `${2 * l + w} m`],
      `Perimeter = 2(l + w) = 2(${l} + ${w}) = ${2 * (l + w)} m.`);
  },
];

/* ----------------------------- SERIES (shared) ----------------------------- */
function series(subject) {
  const type = ri(0, 5);
  let seq, next, rule;
  if (type === 0) {
    const a = ri(1, 30), d = ri(2, 12);
    seq = Array.from({ length: 5 }, (_, i) => a + i * d); next = a + 5 * d; rule = `Add ${d} each time.`;
  } else if (type === 1) {
    const a = ri(1, 5), r = ri(2, 3);
    seq = Array.from({ length: 5 }, (_, i) => a * r ** i); next = a * r ** 5; rule = `Multiply by ${r} each time.`;
  } else if (type === 2) {
    const s = ri(1, 6);
    seq = Array.from({ length: 5 }, (_, i) => (s + i) ** 2); next = (s + 5) ** 2; rule = `Squares: ${s}², ${s + 1}², ... next is ${s + 5}².`;
  } else if (type === 3) {
    const a = ri(1, 10), d = ri(1, 3);
    seq = [a]; let inc = d;
    for (let i = 1; i < 5; i++) { seq.push(seq[i - 1] + inc); inc += d; }
    next = seq[4] + inc; rule = `The difference increases by ${d}: +${d}, +${2 * d}, +${3 * d}, ...`;
  } else if (type === 4) {
    const a = ri(2, 10), b = ri(2, 10);
    seq = [a, b]; for (let i = 2; i < 6; i++) seq.push(seq[i - 1] + seq[i - 2]);
    next = seq[5]; seq = seq.slice(0, 5); rule = 'Each term is the sum of the two terms before it.';
  } else {
    const a = ri(20, 60), x = ri(2, 6), y = ri(1, 4);
    seq = [a]; for (let i = 1; i < 6; i++) seq.push(i % 2 ? seq[i - 1] + x : seq[i - 1] - y);
    next = seq[5]; seq = seq.slice(0, 5); rule = `Alternating pattern: +${x}, −${y}.`;
  }
  return mk(subject, 'Number Series', `What is the next number in the series? ${seq.join(', ')}, ___`,
    next, numDistractors(next, { step: Math.max(1, Math.abs(seq[4] - seq[3])) }), rule);
}

/* ----------------------------- ANALYTICAL ----------------------------- */
const A = 'analytical';
const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const shiftWord = (w, k) => w.split('').map((ch) => L[(L.indexOf(ch) + k + 26) % 26]).join('');
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DIRS = ['North', 'East', 'South', 'West'];
const GROUPS = ['teachers', 'singers', 'dancers', 'writers', 'farmers', 'engineers', 'runners', 'painters', 'nurses', 'drivers', 'lawyers', 'cooks'];

const analytical = [
  function numberSeriesA() { return series(A); },
  function letterSeries() {
    const k = ri(1, 4), s = ri(0, 26 - 6 * k - 1);
    if (s < 0) return null;
    const seq = Array.from({ length: 5 }, (_, i) => L[s + i * k]);
    const next = L[s + 5 * k];
    return mk(A, 'Letter Series', `What letter comes next? ${seq.join(', ')}, ___`,
      next, [L[(s + 5 * k + 1) % 26], L[(s + 5 * k - 1 + 26) % 26], L[(s + 5 * k + k + 1) % 26], L[(s + 4 * k + 1) % 26]],
      `Each letter moves ${k} place${k > 1 ? 's' : ''} forward in the alphabet.`);
  },
  function letterPairs() {
    const s = ri(0, 8);
    const seq = Array.from({ length: 4 }, (_, i) => L[s + i] + L[25 - s - i]);
    const next = L[s + 4] + L[25 - s - 4];
    return mk(A, 'Letter Series', `What comes next? ${seq.join(', ')}, ___`,
      next, [L[s + 4] + L[25 - s - 5], L[s + 5] + L[25 - s - 4], L[25 - s - 4] + L[s + 4], L[s + 3] + L[25 - s - 3]],
      'The first letter moves forward one step (A, B, C, ...) while the second moves backward from Z (Z, Y, X, ...).');
  },
  function coding() {
    const words = ['CAT', 'DOG', 'BOOK', 'DESK', 'LAMP', 'FISH', 'BIRD', 'TREE', 'SHIP', 'GOLD', 'RICE', 'MILK', 'PARK', 'WIND'];
    const [w1, w2] = shuffle(words);
    const k = pick([1, 2, 3, -1, -2]);
    const ans = shiftWord(w2, k);
    return mk(A, 'Coding-Decoding', `If ${w1} is coded as ${shiftWord(w1, k)}, how is ${w2} coded?`,
      ans, [shiftWord(w2, k + 1), shiftWord(w2, k - 1), shiftWord(w2, -k), ans.split('').reverse().join('')],
      `Each letter is shifted ${Math.abs(k)} place${Math.abs(k) > 1 ? 's' : ''} ${k > 0 ? 'forward' : 'backward'} in the alphabet.`);
  },
  function syllogism() {
    const [X, Y, Z] = shuffle(GROUPS);
    const t = ri(0, 3);
    const T = [
      [`All ${X} are ${Y}. All ${Y} are ${Z}.`, `All ${X} are ${Z}.`, [`All ${Z} are ${X}.`, `No ${X} are ${Z}.`, `All ${Z} are ${Y}.`]],
      [`All ${X} are ${Y}. No ${Y} are ${Z}.`, `No ${X} are ${Z}.`, [`All ${Z} are ${X}.`, `Some ${X} are ${Z}.`, `All ${Z} are ${Y}.`]],
      [`Some ${X} are ${Y}. All ${Y} are ${Z}.`, `Some ${X} are ${Z}.`, [`All ${X} are ${Z}.`, `All ${Z} are ${X}.`, `No ${X} are ${Z}.`]],
      [`No ${X} are ${Y}. All ${Z} are ${Y}.`, `No ${Z} are ${X}.`, [`All ${X} are ${Z}.`, `Some ${Z} are ${X}.`, `All ${Y} are ${Z}.`]],
    ][t];
    return mk(A, 'Logic (Syllogism)', `${T[0]} Which conclusion necessarily follows?`, T[1], T[2],
      'Only this conclusion must be true if both premises are true. You can check using a Venn diagram.');
  },
  function direction() {
    const d = ri(0, 3), a = ri(2, 9), b = ri(2, 9);
    const name = pick(['Rico', 'Lea', 'Tess', 'Arnel', 'Joy']);
    const turn = pick(['right', 'left']);
    const fin = DIRS[(d + (turn === 'right' ? 1 : 3)) % 4];
    return mk(A, 'Directions', `${name} walked ${a} km ${DIRS[d]}, turned ${turn} and walked ${b} km, then turned ${turn} again and walked ${a} km. In which direction is ${name} now from the starting point?`,
      fin, DIRS.filter((x) => x !== fin),
      `After going ${a} km ${DIRS[d]} and then ${a} km back the opposite way, only the ${b} km ${fin} remains. ${name} is ${b} km ${fin} of the start.`);
  },
  function ranking() {
    const n = ri(15, 50), k = ri(3, n - 3);
    return mk(A, 'Ranking', `In a row of ${n} students, Carla is ${ord(k)} from the left. What is her position from the right?`,
      n - k + 1, [n - k, n - k + 2, k, n - k - 1],
      `Position from right = total − position from left + 1 = ${n} − ${k} + 1 = ${n - k + 1}.`);
  },
  function calendar() {
    const t = ri(0, 6), n = ri(10, 100);
    const ans = DAYS[(t + n) % 7];
    return mk(A, 'Calendar', `If today is ${DAYS[t]}, what day of the week will it be ${n} days from today?`,
      ans, shuffle(DAYS.filter((x) => x !== ans)),
      `${n} ÷ 7 = ${Math.floor(n / 7)} remainder ${n % 7}. Move ${n % 7} day(s) forward from ${DAYS[t]} → ${ans}.`);
  },
  function dataInterp() {
    const months = ['January', 'February', 'March', 'April', 'May'];
    const vals = months.map(() => ri(10, 60) * 5);
    const table = months.map((m, i) => `${m}: ${vals[i]}`).join('; ');
    if (Math.random() < 0.5) {
      const total = vals.reduce((x, y) => x + y, 0);
      return mk(A, 'Data Interpretation', `A store recorded the following number of units sold — ${table}. What is the total number of units sold in the five months?`,
        total, numDistractors(total, { step: 10 }), `${vals.join(' + ')} = ${total}.`);
    }
    let best = 1;
    for (let i = 2; i < 5; i++) if (vals[i] - vals[i - 1] > vals[best] - vals[best - 1]) best = i;
    const inc = vals[best] - vals[best - 1];
    if (inc <= 0 || vals.filter((v, i) => i > 0 && v - vals[i - 1] === inc).length > 1) return null;
    const ans = `${months[best - 1]} to ${months[best]}`;
    const others = [1, 2, 3, 4].filter((i) => i !== best).map((i) => `${months[i - 1]} to ${months[i]}`);
    return mk(A, 'Data Interpretation', `A store recorded the following number of units sold — ${table}. Between which two consecutive months was the greatest increase in sales?`,
      ans, others, `The increase from ${months[best - 1]} to ${months[best]} is ${inc} units, the largest among all months.`);
  },
  function oddNumber() {
    const r = ri(2, 9);
    const mult = shuffle(Array.from({ length: 12 }, (_, i) => r * (i + 2))).slice(0, 3);
    let odd;
    do { odd = ri(10, 99); } while (odd % r === 0);
    return mk(A, 'Classification', `Which number does NOT belong to the group?`,
      odd, mult, `All the other numbers are multiples of ${r}; ${odd} is not.`);
  },
];

/* ----------------------------- CLERICAL ----------------------------- */
const C = 'clerical';
const SURNAMES = ['Santos', 'Reyes', 'Cruz', 'Bautista', 'Ocampo', 'Garcia', 'Mendoza', 'Torres', 'Tomas', 'Andrada', 'Castillo', 'Flores', 'Villanueva', 'Ramos', 'Castro', 'Rivera', 'Aquino', 'Navarro', 'Salazar', 'Mercado', 'Dela Cruz', 'De Leon', 'Del Rosario', 'Pascual', 'Panganiban', 'Pangilinan', 'Manalo', 'Macaraeg', 'Magsaysay', 'Mabini', 'Dizon', 'Domingo', 'Soriano', 'Sarmiento'];
const FIRST = ['Juan', 'Maria', 'Jose', 'Ana', 'Pedro', 'Rosa', 'Carlo', 'Liza', 'Mark', 'Grace', 'Paolo', 'Joy', 'Ramon', 'Teresa', 'Miguel', 'Carmen'];
const STREETS = ['Rizal St.', 'Mabini Ave.', 'Bonifacio Rd.', 'Luna St.', 'Quezon Blvd.', 'Aguinaldo Hwy.', 'Burgos St.', 'Del Pilar St.'];
const CITIES = ['Quezon City', 'Pasig City', 'Cebu City', 'Davao City', 'Iloilo City', 'Baguio City', 'Makati City', 'Tacloban City'];
const filingKey = (s) => s.replace(/[\s.,]/g, '').toUpperCase();

function mutate(s) {
  const i = ri(0, s.length - 1);
  const ch = s[i];
  if (/\d/.test(ch)) return s.slice(0, i) + String((+ch + ri(1, 8)) % 10) + s.slice(i + 1);
  if (/[a-z]/i.test(ch)) {
    const sw = { a: 'e', e: 'a', i: 'l', l: 'i', o: 'a', n: 'm', m: 'n', u: 'o', r: 'n', s: 'z', c: 'k', t: 'f' };
    const low = ch.toLowerCase();
    const rep = sw[low] || 'x';
    return s.slice(0, i) + (ch === low ? rep : rep.toUpperCase()) + s.slice(i + 1);
  }
  return null;
}
function variants(s, n) {
  const out = new Set();
  let guard = 0;
  while (out.size < n && guard++ < 100) {
    const v = mutate(s);
    if (v && v !== s) out.add(v);
  }
  return [...out];
}

const SPELL = ['accommodate', 'acknowledgment', 'apparent', 'argument', 'beginning', 'believe', 'bureaucracy', 'calendar', 'cemetery', 'colleague', 'commitment', 'committee', 'conscientious', 'consensus', 'definitely', 'dilemma', 'discipline', 'embarrass', 'environment', 'exaggerate', 'existence', 'familiar', 'foreign', 'government', 'grammar', 'guarantee', 'harass', 'immediately', 'independent', 'indispensable', 'liaison', 'maintenance', 'millennium', 'miniature', 'mischievous', 'necessary', 'noticeable', 'occasion', 'occurrence', 'parliament', 'perseverance', 'personnel', 'possession', 'privilege', 'pronunciation', 'questionnaire', 'receive', 'recommend', 'referred', 'reminiscent', 'rhythm', 'separate', 'sergeant', 'succeed', 'supersede', 'threshold', 'tomorrow', 'transferred', 'unanimous', 'vacuum', 'withhold'];
function misspell(w) {
  const rules = [
    (s) => s.replace(/(.)\1/, '$1'),
    (s) => { const m = s.match(/[bcdfglmnprst](?=[aeiou])/g); if (!m) return s; const i = s.search(/[bcdfglmnprst](?=[aeiou])/); return s.slice(0, i + 1) + s[i] + s.slice(i + 1); },
    (s) => s.replace('ie', 'ei') !== s ? s.replace('ie', 'ei') : s.replace('ei', 'ie'),
    (s) => { const i = ri(1, s.length - 2); const v = 'aeiou'; if (!v.includes(s[i])) return s; return s.slice(0, i) + v[(v.indexOf(s[i]) + ri(1, 4)) % 5] + s.slice(i + 1); },
    (s) => { const i = ri(1, s.length - 3); return s.slice(0, i) + s[i + 1] + s[i] + s.slice(i + 2); },
    (s) => s.replace(/ance$/, 'ence').replace(/ence$/, 'ance').replace(/ary$/, 'ery').replace(/able$/, 'ible'),
  ];
  const out = new Set();
  let g = 0;
  while (out.size < 3 && g++ < 200) {
    const v = pick(rules)(w);
    if (v !== w && !SPELL.includes(v)) out.add(v);
  }
  return [...out];
}

const clerical = [
  function alphaFirst() {
    const names = shuffle(SURNAMES).slice(0, 4).map((s) => `${s}, ${pick(FIRST)}`);
    const sorted = names.slice().sort((a, b) => filingKey(a).localeCompare(filingKey(b)));
    const which = pick([['FIRST', 0], ['SECOND', 1], ['THIRD', 2], ['LAST', 3]]);
    return mk(C, 'Alphabetical Filing', `If the following names are arranged in alphabetical order, which name will come ${which[0]}?`,
      sorted[which[1]], sorted.filter((_, i) => i !== which[1]),
      `Alphabetical order: ${sorted.join(' → ')}. Surnames with prefixes like "Dela" or "De" are filed as one word (DELACRUZ, DELEON).`);
  },
  function sameName() {
    const s = `${pick(FIRST)} ${pick('ABCDEFGHMPRST'.split(''))}. ${pick(SURNAMES)}`;
    const v = variants(s, 3);
    return mk(C, 'Checking Names', `Which of the following is EXACTLY the same as: "${s}"?`, s, v,
      `Compare letter by letter. Only "${s}" matches exactly.`);
  },
  function sameAddress() {
    const s = `${ri(10, 2999)} ${pick(STREETS)}, ${pick(CITIES)}`;
    const v = variants(s, 3);
    return mk(C, 'Checking Addresses', `Which of the following is EXACTLY the same as: "${s}"?`, s, v,
      'Check each number and letter carefully. Only one choice matches exactly.');
  },
  function sameNumber() {
    const s = `${ri(100, 999)}-${ri(1000, 9999)}-${ri(10, 99)}`;
    const v = variants(s, 3);
    return mk(C, 'Checking Numbers', `Which of the following is EXACTLY the same as the reference number ${s}?`, s, v,
      'Compare each digit group. Only one is identical.');
  },
  function spelling() {
    const w = pick(SPELL);
    const v = misspell(w);
    return mk(C, 'Spelling', 'Which word is spelled correctly?', w, v, `The correct spelling is "${w}".`);
  },
  function ascending() {
    const nums = shuffle(Array.from({ length: 4 }, () => ri(1000, 9999)));
    if (new Set(nums).size < 4) return null;
    const asc = nums.slice().sort((a, b) => a - b);
    const opts = [asc, nums, [asc[1], asc[0], asc[2], asc[3]], [asc[0], asc[2], asc[1], asc[3]], asc.slice().reverse()].map((x) => x.join(', '));
    return mk(C, 'Numerical Filing', `Arrange these numbers from lowest to highest: ${nums.join(', ')}`,
      opts[0], opts.slice(1), `Lowest to highest: ${opts[0]}.`);
  },
  function countMatch() {
    const pool = shuffle(SURNAMES).slice(0, 5);
    const ref = pool.map((s) => s.toUpperCase());
    const copy = ref.map((s) => (Math.random() < 0.45 ? (variants(s, 1)[0] || s) : s));
    const diff = ref.filter((s, i) => s !== copy[i]).length;
    return mk(C, 'Checking Lists', `Compare the two lists. How many pairs are NOT exactly the same?\nList A: ${ref.join(' | ')}\nList B: ${copy.join(' | ')}`,
      diff, [0, 1, 2, 3, 4, 5].filter((x) => x !== diff),
      `${diff} pair(s) differ. Compare letter by letter.`);
  },
  function filingBetween() {
    const names = shuffle(SURNAMES).slice(0, 6).sort((a, b) => filingKey(a).localeCompare(filingKey(b)));
    const [lo, mid, hi] = [names[0], names[2], names[4]];
    const outside = [names[5], names[3] === mid ? names[5] : names[3]];
    const before = SURNAMES.filter((s) => filingKey(s) < filingKey(lo));
    const after = SURNAMES.filter((s) => filingKey(s) > filingKey(hi));
    const ds = shuffle([...before.slice(0, 2), ...after.slice(-2)]);
    if (ds.length < 3) return null;
    return mk(C, 'Alphabetical Filing', `In an alphabetical file, which surname should be placed between "${lo}" and "${hi}"?`,
      mid, ds.concat(outside.filter((x) => filingKey(x) > filingKey(hi))),
      `${mid} falls alphabetically between ${lo} and ${hi}.`);
  },
];

        passed: mocks.filter((a) => (a.score * 100) / a.total >= 80).length, avgMock: avg(mocks.map((a) => (a.score * 100) / a.total)),
        questions: Object.entries(counts).sort().map(([subject, n]) => ({ subject, n })) };
    }
    if (method === 'GET' && path === '/api/admin/users') {
      const q = String(query.get('q') || '').toLowerCase();
      return db.users.filter((u) => !q || u.name.toLowerCase().includes(q) || u.email.includes(q)).sort((x, y) => (x.created_at < y.created_at ? 1 : -1)).map((u) => {
        const mine = db.attempts.filter((a) => a.user_id === u.id);
        return { id: u.id, name: u.name, email: u.email, role: u.role, disabled: u.disabled, created_at: u.created_at, attempts: mine.filter(finished).length,
          avg_mock: avg(mine.filter((a) => finished(a) && a.mode !== 'practice').map((a) => (a.score * 100) / a.total)),
          last_active: mine.length ? Math.max(...mine.map((a) => a.started_at)) : null };
      });
    }
    if ((m = path.match(/^\/api\/admin\/users\/(\d+)$/))) {
      const id = Number(m[1]);
      if (id === me.id) fail(400, method === 'DELETE' ? 'Hindi mo mabubura ang sarili mong account.' : 'Hindi mo mababago ang sarili mong role o status dito.');
      const u = db.users.find((x) => x.id === id) || fail(404, 'Walang ganitong user.');
      if (method === 'PATCH') {
        if (body.role !== undefined) u.role = body.role === 'admin' ? 'admin' : 'user';
        if (body.disabled !== undefined) u.disabled = body.disabled ? 1 : 0;
        save(); return { ok: true };
      }
      if (method === 'DELETE') { db.users = db.users.filter((x) => x.id !== id); db.attempts = db.attempts.filter((a) => a.user_id !== id); save(); return { ok: true }; }
    }
    if ((m = path.match(/^\/api\/admin\/users\/(\d+)\/password$/)) && method === 'POST') {
      const u = db.users.find((x) => x.id === Number(m[1])) || fail(404, 'Walang ganitong user.');
      if (String(body.password || '').length < 8) fail(400, 'Ang password ay dapat may 8 characters o higit pa.');
      u.salt = randSalt(); u.pass_hash = await hash(String(body.password), u.salt); save();
      return { ok: true };
    }
    if ((m = path.match(/^\/api\/admin\/users\/(\d+)\/attempts$/))) {
      return db.attempts.filter((a) => a.user_id === Number(m[1])).sort((x, y) => y.started_at - x.started_at).map((a) => attemptView(a, false));
    }
    if (method === 'GET' && path === '/api/admin/questions') {
      const subject = query.get('subject'); const q = String(query.get('q') || '').toLowerCase(); const page = Math.max(0, Number(query.get('page')) || 0);
      const rows = db.questions.filter((x) => x.active && (!SUBJECTS[subject] || x.subject === subject) && (!q || x.question.toLowerCase().includes(q) || x.topic.toLowerCase().includes(q)))
        .sort((x, y) => y.id - x.id);
      return { total: rows.length, page, rows: rows.slice(page * 50, page * 50 + 50).map((r) => ({ ...r, choices: JSON.parse(r.choices) })) };
    }
    if (method === 'POST' && path === '/api/admin/questions') {
      const err = validQuestion(body); if (err) fail(400, err);
      const q = { id: ++db.seq.questions, ...qFields(body), source: 'admin', active: 1, created_at: now() };
      db.questions.push(q); save(); return { id: q.id };
    }
    if ((m = path.match(/^\/api\/admin\/questions\/(\d+)$/))) {
      const q = db.questions.find((x) => x.id === Number(m[1])) || fail(404, 'Walang ganitong tanong.');
      if (method === 'PUT') { const err = validQuestion(body); if (err) fail(400, err); Object.assign(q, qFields(body), { source: 'admin' }); save(); return { ok: true }; }
      if (method === 'DELETE') { q.active = 0; q.source = 'admin'; save(); return { ok: true }; }
    }
    if (method === 'POST' && path === '/api/admin/questions/import') {
      const list = Array.isArray(body) ? body : body.questions;
      if (!Array.isArray(list)) fail(400, 'Dapat JSON array ng mga tanong.');
      let added = 0; const errors = [];
      list.slice(0, 2000).forEach((b, i) => {
        const err = validQuestion(b);
        if (err) errors.push(`#${i + 1}: ${err}`);
        else { db.questions.push({ id: ++db.seq.questions, ...qFields(b), source: 'admin', active: 1, created_at: now() }); added++; }
      });
      save(); return { added, errors: errors.slice(0, 20) };
    }
    if (method === 'GET' && path === '/api/admin/attempts') {
      return done.sort((x, y) => y.finished_at - x.finished_at).slice(0, 200).map((a) => {
        const u = db.users.find((x) => x.id === a.user_id) || { name: '(nabura)', email: '' };
        return { id: a.id, mode: a.mode, title: a.title, score: a.score, total: a.total, started_at: a.started_at, finished_at: a.finished_at, name: u.name, email: u.email };
      });
    }
    fail(404, 'Not found');
  }

  // Route the app's fetch('/api/...') calls to the offline backend.
  window.fetch = async (url, opts = {}) => {
    const u = new URL(url, 'http://offline.local');
    if (!u.pathname.startsWith('/api/')) return realFetch(url, opts);
    let status = 200, data;
    try {
      data = await handle((opts.method || 'GET').toUpperCase(), u.pathname, u.searchParams, opts.body ? JSON.parse(opts.body) : {});
    } catch (e) {
      status = e.status || 500; data = { error: e.status ? e.message : 'May nangyaring error: ' + e.message };
      if (!e.status) console.error(e);
    }
    return new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
  };

  window.addEventListener('online', syncQuestions);
  setTimeout(syncQuestions, 1500);
  window.cseOfflineBankInfo = () => { load(); return { version: mem.bank_version, updated: mem.bank_updated, count: mem.questions.filter((q) => q.source === 'seed').length }; };

  window.cseOfflineReset = () => { localStorage.removeItem(KEY); localStorage.removeItem(SKEY); location.reload(); };
})();
