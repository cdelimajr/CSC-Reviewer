<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walang internet · CSE Reviewer</title>
<meta name="theme-color" content="#1e40af">
<style>
  :root { --bg: #f4f6fb; --card: #fff; --text: #172033; --muted: #5b6478; --primary: #1e40af; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1420; --card: #171e2d; --text: #e7ebf3; --muted: #9aa4b8; --primary: #6b8cff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); border-radius: 14px; padding: 24px; max-width: 380px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  p { color: var(--muted); }
  button { background: var(--primary); color: #fff; border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 600; width: 100%; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:44px">📡</div>
    <h2 style="margin:6px 0">Walang internet</h2>
    <p>Kailangan ng internet para magamit ang CSE Reviewer. Kumonekta sa Wi-Fi o mobile data, tapos subukan ulit.</p>
    <button onclick="location.reload()">Subukan ulit</button>
  </div>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
