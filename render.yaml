services:
  - type: web
    name: cse-reviewer
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DB_PATH
        value: /var/data/cse-reviewer.db
      - key: ADMIN_EMAIL
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
